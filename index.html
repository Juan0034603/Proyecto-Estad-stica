<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — Estadística Inferencial</title>
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/index.css" />
</head>

<body>

  <!-- ── Card principal ──────────────────────────────────────── -->
  <div class="login-card">

    <!-- Cabecera: ícono + título -->
    <div class="login-card__header">
      <div class="login-card__icono">
        <!-- Ícono: distribución normal / campana -->
        <svg width="26" height="26" viewBox="0 0 26 26" fill="none" aria-hidden="true">
          <path d="M2 20 C5 20, 7 8, 13 8 C19 8, 21 20, 24 20" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" />
          <line x1="13" y1="8" x2="13" y2="20" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 2"
            opacity="0.5" />
        </svg>
      </div>
      <h1 class="login-card__titulo">Estadística inferencial</h1>
      <p class="login-card__subtitulo">Ingeniería de Sistemas · Quinto semestre</p>
    </div>

    <!-- Toggle: cambia entre login y registro -->
    <div class="login-toggle">
      <button class="login-toggle__btn activo" id="btn-modo-login" onclick="cambiarModo('login')">
        Iniciar sesión
      </button>
      <button class="login-toggle__btn" id="btn-modo-registro" onclick="cambiarModo('registro')">
        Registrarse
      </button>
    </div>

    <!-- Campos del formulario -->
    <div class="login-campos">

      <!-- Campo nombre: solo visible en modo registro -->
      <div class="campo-grupo" id="campo-nombre" style="display:none;">
        <label for="input-nombre">Nombre completo</label>
        <input type="text" id="input-nombre" placeholder="Ej: Juan Pérez" autocomplete="name" />
      </div>

      <div class="campo-grupo" id="campo-grupo" style="display:none;">
        <label for="input-grupo">Grupo (opcional)</label>
        <input type="text" id="input-grupo" placeholder="Ej: Grupo 1" autocomplete="off" />
      </div>

      <!-- Email: siempre visible -->
      <div class="campo-grupo">
        <label for="input-email">Correo electrónico</label>
        <input type="email" id="input-email" placeholder="tu@correo.com" autocomplete="email" />
      </div>

      <!-- Contraseña: siempre visible -->
      <div class="campo-grupo">
        <label for="input-password">Contraseña</label>
        <input type="password" id="input-password" placeholder="Mínimo 6 caracteres" autocomplete="current-password" />
      </div>

    </div>

    <!-- Mensaje de error (auth.js lo muestra si algo falla) -->
    <div class="login-error" id="login-error"></div>

    <!-- Mensaje de éxito (auth.js lo muestra al registrarse) -->
    <div class="login-exito" id="login-exito"></div>

    <!-- Botón principal: su texto cambia según el modo -->
    <button class="btn btn--primary" id="btn-submit" onclick="submitFormulario()">
      Iniciar sesión
    </button>

    <!-- Footer informativo -->
    <p class="login-card__footer">
      Tus datos se usan exclusivamente para el análisis estadístico del curso.
    </p>

  </div>

  <!-- auth.js maneja toda la lógica de este formulario -->
  <script src="js/auth.js"></script>

</body>

</html>
